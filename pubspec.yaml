name: passvera
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev



version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  # local_auth: ^2.1.6

  #appSpecificUtils
  password_strength_checker: ^1.3.2    # password strength checks from both dictionary and bruteforce ways
  flutter_secure_storage: ^9.2.4
  app_bar_with_search_switch: ^1.8.6
  #general
  flutter_bloc: ^9.1.1         # state management 
  dartz: ^0.10.1       
  auto_route: ^5.0.1           # simplified routing mechanism
  freezed_annotation: ^2.2.0
  injectable: ^2.1.1
  get_it: ^7.6.0                #service locator
  cupertino_icons: ^1.0.9
  lottie: ^3.1.3
  crypto: ^3.0.7
  mobile_scanner: ^7.4.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  auto_route_generator: ^5.0.2
  injectable_generator: ^2.1.5
  build_runner: ^2.4.13
  freezed: ^2.3.4               #code generator for data-classes/unions/pattern-matching/cloning

# Dart 3.10 removed UnmodifiableUint8ListView from dart:typed_data.
# Old win32/archive (pulled by path_provider/lottie) still reference it.
dependency_overrides:
  win32: ^5.10.1
  archive: ^3.6.1

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/animation/
    - assets/google_fonts/OFL.txt

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/google_fonts/Quicksand-Regular.ttf
        - asset: assets/google_fonts/Quicksand-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Quicksand-SemiBold.ttf
          weight: 500
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
