name: passvera
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev



version: 1.0.4+5

environment:
  sdk: '>=3.0.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  # local_auth: ^2.1.6

  #appSpecificUtils
  password_strength_checker: ^1.3.2    # password strength checks from both dictionary and bruteforce ways
  flutter_secure_storage: ^10.3.4
  app_bar_with_search_switch: ^1.8.6
  #general
  flutter_bloc: ^9.1.1         # state management 
  dartz: ^0.10.1       
  # 11.2+ depends on material_ui/cupertino_ui and APIs (e.g. scrollCacheExtent)
  # missing in Flutter 3.38; lift this cap together with the Flutter upgrade.
  auto_route: ">=11.1.0 <11.2.0"   # simplified routing mechanism
  freezed_annotation: ^3.1.0
  injectable: ^3.0.0
  get_it: ^9.3.0                #service locator
  cupertino_icons: ^1.0.9
  lottie: ^3.1.3
  crypto: ^3.0.7
  mobile_scanner: ^7.4.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  auto_route_generator: ^10.5.0
  injectable_generator: ^3.0.2
  build_runner: ^2.15.1
  freezed: ^3.2.5               #code generator for data-classes/unions/pattern-matching/cloning

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/animation/
    - assets/google_fonts/OFL.txt

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/google_fonts/Quicksand-Regular.ttf
        - asset: assets/google_fonts/Quicksand-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Quicksand-SemiBold.ttf
          weight: 500
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
